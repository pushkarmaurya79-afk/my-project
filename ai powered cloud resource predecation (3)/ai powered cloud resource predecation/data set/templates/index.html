 <!DOCTYPE html>
<html>
<head>
    <title>Cloud Prediction</title>
</head>

<body>

    <h1>AI Cloud Resource Prediction</h1>

    <form action="/predict" method="POST">

        <label>CPU Usage:</label>
        <input type="number" step="any" name="cpu" required>
        <br><br>

        <label>Memory Usage:</label>
        <input type="number" step="any" name="memory" required>
        <br><br>

        <label>Disk Usage:</label>
        <input type="number" step="any" name="disk" required>
        <br><br>

        <button type="submit">Predict</button>

    </form>

    {% if prediction is defined %}
        <h2>Prediction Result:</h2>
        <h2>{{ prediction }}</h2>
    {% endif %}

</body>
</html>
